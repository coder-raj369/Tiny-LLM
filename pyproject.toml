[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-llm"
version = "0.1.0"
description = "A tiny GPT-style transformer LLM for domain-specific Q&A (quantum computing focus)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Raj Pandit", email = "code.raj369@gmail.com"}
]

dependencies = [
    "torch>=2.0.0,<3.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "pydantic>=2.0.0",
    "tokenizers>=0.14.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]
frontend = [
    "streamlit>=1.29.0",
    "requests>=2.31.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
mlops = [
    "mlflow>=2.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "datasets>=2.14.0",
]
data = [
    "dvc>=3.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/coder-raj369/Tiny-LLM"
Issues = "https://github.com/coder-raj369/Tiny-LLM/issues"

[tool.setuptools]
packages = ["tiny_llm"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
