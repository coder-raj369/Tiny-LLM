services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiny-llm-api
    command: uvicorn tiny_llm.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      TINY_LLM_CORS_ORIGINS: "http://localhost:8501"
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health', timeout=3).raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tiny-llm-frontend
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      TINY_LLM_API_URL: "http://api:8000/api/v1"
    depends_on:
      - api
    volumes:
      - .:/app
    restart: unless-stopped
